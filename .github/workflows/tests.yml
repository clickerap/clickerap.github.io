name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Spelgids klopt met de speldata
        run: npm run gids && git diff --exit-code SPELGIDS.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
